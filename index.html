        const FileUploader = ({ onDataLoaded }) => {
            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    const bstr = evt.target.result;
                    if (file.name.endsWith('.csv')) {
                         Papa.parse(file, {
                            header: true,
                            dynamicTyping: true,
                            skipEmptyLines: true,
                            complete: (results) => onDataLoaded(results.data)
                        });
                    } else {
                        const wb = XLSX.read(bstr, { type: 'binary' });
                        const wsname = wb.SheetNames[0];
                        const ws = wb.Sheets[wsname];
                        const data = XLSX.utils.sheet_to_json(ws);
                        onDataLoaded(data);
                    }
                };
                if (file.name.endsWith('.csv')) {
                    reader.readAsText(file);
                } else {
                    reader.readAsBinaryString(file);
                }
            };
            return (
                <div className="relative group no-print">
                    <input type="file" accept=".csv, .xlsx, .xls" onChange={handleFileUpload} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" />
                    <button className="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg transition shadow-md font-medium text-sm">

            const [selectedBrands, setSelectedBrands] = useState(['All']);
            const [months, setMonths] = useState([]);
            const [dateRange, setDateRange] = useState({ start: '', end: '' });

            // Data Processing
            useEffect(() => {
                if (!data || data.length === 0) return;
                const normalized = data.map(row => {
                    const getVal = (keyPart) => {
                        const keys = Object.keys(row);
                        let key = keys.find(k => k === keyPart) || keys.find(k => k.toLowerCase() === keyPart.toLowerCase()) || keys.find(k => k.toLowerCase().includes(keyPart.toLowerCase()));
                        return key ? row[key] : null;
                    };
                    const brand = getVal('Brand') || 'Unknown';
                    const month = getVal('Cohort Month') || getVal('Cohort_Month');
                    if (!brand || !month) return null;

                    let retentionRate = Number(getVal('Retention Rate (%)')) || Number(getVal('Retention Rate')) || 0;
                    if (typeof getVal('Retention Rate (%)') === 'string' && getVal('Retention Rate (%)').includes('%')) {
                         retentionRate = parseFloat(getVal('Retention Rate (%)')) / 100;
                    }

                    return {
                        brand: brand,
                        month: month,
                        totalFTDs: Number(getVal('Total FTDs')) || Number(getVal('Total_FTDs')) || 0,
                        retainedM1: Number(getVal('Retained in M1')) || Number(getVal('Total_Retained')) || 0,
                        amount: Number(getVal('Total FTD Amount')) || Number(getVal('Amount')) || 0,
                        retentionRate: retentionRate
                    };
                }).filter(Boolean);

                normalized.sort((a, b) => new Date(a.month) - new Date(b.month));
                const uniqueBrands = ['All', ...new Set(normalized.map(d => d.brand))];
                const uniqueMonths = [...new Set(normalized.map(d => d.month))];

                setBrands(uniqueBrands);
                setMonths(uniqueMonths);
                if (!dateRange.start || !uniqueMonths.includes(dateRange.start)) {
                    setDateRange({ start: uniqueMonths[0], end: uniqueMonths[uniqueMonths.length - 1] });
                }
            }, [data]);

            const processedDisplayData = useMemo(() => {

                        const keys = Object.keys(row);
                        let key = keys.find(k => k === keyPart) || keys.find(k => k.toLowerCase() === keyPart.toLowerCase()) || keys.find(k => k.toLowerCase().includes(keyPart.toLowerCase()));

                    };
                    const mVal = getVal('Cohort Month') || getVal('Cohort_Month');
                    if (!mVal) return null;

                    if (typeof getVal('Retention Rate (%)') === 'string' && getVal('Retention Rate (%)').includes('%')) rr = parseFloat(getVal('Retention Rate (%)')) / 100;
                    return {
                        brand: getVal('Brand') || 'Unknown',
                        month: mVal,
                        totalFTDs: Number(getVal('Total FTDs')) || 0,
                        retainedM1: Number(getVal('Retained in M1')) || 0,
                        amount: Number(getVal('Total FTD Amount')) || 0,
                        retentionRate: rr
                    };
                }).filter(Boolean);

                return normalized.filter(item => {
                    const brandMatch = selectedBrands.includes('All') || selectedBrands.includes(item.brand);
                    const dateMatch = (!dateRange.start || !dateRange.end) ? true : (item.month >= dateRange.start && item.month <= dateRange.end);
                    return brandMatch && dateMatch;
                }).sort((a, b) => new Date(a.month) - new Date(b.month));
            }, [data, selectedBrands, dateRange]);

            // Aggregations
            const chartsData = useMemo(() => {
                const grouped = {};
                processedDisplayData.forEach(item => {
                    if (!grouped[item.month]) grouped[item.month] = { month: item.month, totalFTDs: 0, retainedM1: 0, totalAmount: 0 };
                    grouped[item.month].totalFTDs += item.totalFTDs;
                    grouped[item.month].retainedM1 += item.retainedM1;
                    grouped[item.month].totalAmount += item.amount;
                });
                return Object.values(grouped).map(g => ({
                    ...g,
                    avgRetentionRate: g.totalFTDs > 0 ? (g.retainedM1 / g.totalFTDs) * 100 : 0
                })).sort((a, b) => new Date(a.month) - new Date(b.month));
            }, [processedDisplayData]);

            const scatterData = useMemo(() => {
                 const grouped = {};
                 processedDisplayData.forEach(item => {
                     if (!grouped[item.brand]) grouped[item.brand] = { brand: item.brand, totalFTDs: 0, retainedM1: 0, totalAmount: 0 };
                     grouped[item.brand].totalFTDs += item.totalFTDs;
                     grouped[item.brand].retainedM1 += item.retainedM1;
                     grouped[item.brand].totalAmount += item.amount;
                 });
                 return Object.values(grouped).map(g => ({
                     ...g,
                     retentionRate: g.totalFTDs > 0 ? (g.retainedM1 / g.totalFTDs) * 100 : 0
                 })).filter(g => g.totalFTDs > 0);
            }, [processedDisplayData]);

            const kpi = useMemo(() => {
                const totalFTDs = processedDisplayData.reduce((sum, item) => sum + item.totalFTDs, 0);
                const totalRetained = processedDisplayData.reduce((sum, item) => sum + item.retainedM1, 0);
                const totalRevenue = processedDisplayData.reduce((sum, item) => sum + item.amount, 0);
                const avgRetention = totalFTDs > 0 ? (totalRetained / totalFTDs) * 100 : 0;
                return {
                    ftds: totalFTDs.toLocaleString(),
                    retained: totalRetained.toLocaleString(),
                    revenue: totalRevenue.toLocaleString('en-US', { style: 'currency', currency: 'THB', maximumFractionDigits: 0 }),
                    retentionRate: avgRetention.toFixed(2) + '%'
                };
            }, [processedDisplayData]);

            const formatXAxis = (tickItem) => {
                const date = new Date(tickItem + "-01");
                return date.toLocaleDateString('en-US', { month: 'short', year: '2-digit' });
            };

            const toggleBrand = (brand) => {
                if (brand === 'All') setSelectedBrands(['All']);
                else {
                    let newSelection = selectedBrands.includes('All') ? [] : [...selectedBrands];
                    if (newSelection.includes(brand)) newSelection = newSelection.filter(b => b !== brand);
                    else newSelection.push(brand);
                    if (newSelection.length === 0) newSelection = ['All'];
                    setSelectedBrands(newSelection);
                }
            };

            const COLORS = ['#6366f1', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#06b6d4'];

            if (!Recharts || !Recharts.LineChart) return <div className="p-10 text-center text-slate-500">Initializing Executive Dashboard...</div>;

            return (
                <div className="min-h-screen pb-12">
                    {/* Top Navigation */}
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-20 print:static print:border-none">
                        <div className="max-w-[1400px] mx-auto px-6 py-4 flex justify-between items-center">
                            <div className="flex items-center gap-4">
                                <div className="bg-indigo-600 p-2.5 rounded-xl text-white shadow-lg shadow-indigo-200">
                                    <Briefcase className="w-6 h-6" />
                                </div>
                                <div>
                                    <h1 className="text-xl font-bold text-slate-800 tracking-tight">Executive Dashboard</h1>
                                    <p className="text-xs font-medium text-slate-500 uppercase tracking-wide">FTD & Retention Analytics</p>
                                </div>
                            </div>
                            <div className="flex items-center gap-4 no-print">
                                <FileUploader onDataLoaded={setData} />
                            </div>
                        </div>
                    </header>

                    <main className="max-w-[1400px] mx-auto px-6 mt-8 space-y-8">
                        
                        {/* Filters Panel */}
                        <div className="glass-panel p-5 flex flex-wrap gap-8 items-end no-print">
                            <div className="flex-1 min-w-[250px]">
                                <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Cohort Period</label>
                                <div className="flex items-center gap-3">
                                    <div className="relative flex-1">
                                        <select className="bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-lg block w-full p-2.5 font-medium focus:ring-2 focus:ring-indigo-500 outline-none" value={dateRange.start} onChange={(e) => setDateRange({...dateRange, start: e.target.value})}>{months.map(m => <option key={m} value={m}>{m}</option>)}</select>
                                    </div>
                                    <span className="text-slate-400 font-medium">to</span>
                                    <div className="relative flex-1">
                                        <select className="bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-lg block w-full p-2.5 font-medium focus:ring-2 focus:ring-indigo-500 outline-none" value={dateRange.end} onChange={(e) => setDateRange({...dateRange, end: e.target.value})}>{months.map(m => <option key={m} value={m}>{m}</option>)}</select>
                                    </div>
                                </div>
                            </div>
                            <div className="flex-[2] min-w-[300px]">
                                <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Brand Selection</label>
                                <div className="flex flex-wrap gap-2 max-h-24 overflow-y-auto custom-scrollbar">
                                    {brands.map(brand => (
                                        <button key={brand} onClick={() => toggleBrand(brand)} className={`px-4 py-1.5 rounded-full text-xs font-semibold transition-all shadow-sm ${selectedBrands.includes(brand) ? 'bg-indigo-600 text-white shadow-indigo-200' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'}`}>{brand}</button>
                                    ))}
                                </div>
                            </div>
                        </div>

                        {/* KPI Cards */}
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 print-break">
                            <Card title="Total FTDs" value={kpi.ftds} icon={Users} colorClass="bg-indigo-500" />
                            <Card title="Retained (M1)" value={kpi.retained} subValue="Active users next month" icon={TrendingUp} colorClass="bg-emerald-500" />
                            <Card title="Avg. Retention Rate" value={kpi.retentionRate} subValue="Performance Indicator" icon={Activity} colorClass="bg-violet-500" />
                            <Card title="Total Revenue" value={kpi.revenue} subValue="Gross FTD Amount" icon={DollarSign} colorClass="bg-amber-500" />
                        </div>

                        {/* Charts Area */}
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 print-break">
                            
                            {/* Chart 1 */}
                            <div className="glass-panel p-6 h-[500px]">
                                <div className="mb-6">
                                    <h2 className="text-lg font-bold text-slate-800 flex items-center gap-2">
                                        <Layers className="text-indigo-600 w-5 h-5"/> 
                                        Volume vs. Quality Trend
                                    </h2>
                                    <p className="text-sm text-slate-500">Correlating new user volume (FTDs) with retention quality over time.</p>
                                </div>
                                <ResponsiveContainer width="100%" height="80%">
                                    <ComposedChart data={chartsData} margin={{ top: 10, right: 30, left: 10, bottom: 10 }}>
                                        <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                                        <XAxis dataKey="month" tickFormatter={formatXAxis} stroke="#94a3b8" fontSize={12} tickLine={false} axisLine={false} dy={10} />
                                        <YAxis yAxisId="left" stroke="#94a3b8" fontSize={12} tickLine={false} axisLine={false} label={{ value: 'FTD Volume', angle: -90, position: 'insideLeft', fill: '#cbd5e1', fontSize: 10 }} />
                                        <YAxis yAxisId="right" orientation="right" stroke="#6366f1" fontSize={12} unit="%" tickLine={false} axisLine={false} />
                                        <Tooltip 
                                            contentStyle={{ backgroundColor: '#fff', borderRadius: '12px', border: 'none', boxShadow: '0 10px 15px -3px rgba(0,0,0,0.1)' }}
                                            formatter={(value, name) => [name === 'Retention Rate' ? `${value.toFixed(2)}%` : value.toLocaleString(), name]}
                                        />
                                        <Legend wrapperStyle={{ paddingTop: '20px' }} />
                                        <Bar yAxisId="left" dataKey="totalFTDs" name="Total FTDs" fill="#c7d2fe" radius={[6, 6, 0, 0]} barSize={40} />
                                        <Line yAxisId="right" type="monotone" dataKey="avgRetentionRate" name="Retention Rate" stroke="#4f46e5" strokeWidth={3} dot={{ r: 4, fill: '#4f46e5', strokeWidth: 2, stroke: '#fff' }} activeDot={{ r: 6 }} />
                                    </ComposedChart>
                                </ResponsiveContainer>
                            </div>

                            {/* Chart 2 */}
                            <div className="glass-panel p-6 h-[500px]">
                                <div className="mb-6">
                                    <h2 className="text-lg font-bold text-slate-800 flex items-center gap-2">
                                        <Activity className="text-purple-600 w-5 h-5"/> 
                                        Brand Performance Matrix
                                    </h2>
                                    <p className="text-sm text-slate-500">Comparing Brand Volume vs. Retention Quality. (Bubble size = Revenue)</p>
                                </div>
                                <ResponsiveContainer width="100%" height="80%">
                                    <ScatterChart margin={{ top: 20, right: 30, bottom: 20, left: 10 }}>
                                        <CartesianGrid strokeDasharray="3 3" stroke="#f1f5f9" />
                                        <XAxis type="number" dataKey="totalFTDs" name="Total FTDs" unit="" stroke="#94a3b8" fontSize={12} tickLine={false} axisLine={false} label={{ value: 'Total FTDs (Volume)', position: 'bottom', offset: 0, fill: '#94a3b8', fontSize: 12 }} />
                                        <YAxis type="number" dataKey="retentionRate" name="Retention Rate" unit="%" stroke="#94a3b8" fontSize={12} tickLine={false} axisLine={false} label={{ value: 'Retention Rate (Quality)', angle: -90, position: 'insideLeft', fill: '#94a3b8', fontSize: 12 }} />
                                        <ZAxis type="number" dataKey="totalAmount" range={[200, 2000]} name="Total Amount" />
                                        <Tooltip cursor={{ strokeDasharray: '3 3' }} content={({ active, payload }) => {
                                            if (active && payload && payload.length) {
                                                const data = payload[0].payload;
                                                return (
                                                    <div className="bg-white p-4 border border-slate-100 shadow-xl rounded-xl">
                                                        <p className="font-bold text-slate-800 text-lg mb-2">{data.brand}</p>
                                                        <div className="space-y-1">
                                                            <div className="flex justify-between gap-4 text-sm"><span className="text-slate-500">FTDs:</span> <span className="font-semibold text-indigo-600">{data.totalFTDs.toLocaleString()}</span></div>
                                                            <div className="flex justify-between gap-4 text-sm"><span className="text-slate-500">Retention:</span> <span className="font-semibold text-emerald-600">{data.retentionRate.toFixed(2)}%</span></div>
                                                            <div className="flex justify-between gap-4 text-sm"><span className="text-slate-500">Revenue:</span> <span className="font-semibold text-amber-600">{data.totalAmount.toLocaleString()}</span></div>
                                                        </div>
                                                    </div>
                                                );
                                            }
                                            return null;
                                        }} />
                                        <Scatter name="Brands" data={scatterData} fill="#8884d8">
                                            {scatterData.map((entry, index) => <Cell key={`cell-${index}`} fill={COLORS[index % COLORS.length]} />)}
                                        </Scatter>
                                    </ScatterChart>
                                </ResponsiveContainer>
                            </div>
                        </div>

                        {/* Detailed Table */}
                        <div className="glass-panel p-6 overflow-hidden print-break">
                            <h2 className="text-lg font-bold text-slate-800 mb-6 flex items-center gap-2">
                                <FileSpreadsheet className="text-slate-600 w-5 h-5"/> 
                                Detailed Performance Data
                            </h2>
                            <div className="overflow-x-auto">
                                <table className="min-w-full divide-y divide-slate-200">
                                    <thead className="bg-slate-50">
                                        <tr>
                                            <th className="px-6 py-4 text-left text-xs font-bold text-slate-500 uppercase tracking-wider">Cohort Month</th>
                                            <th className="px-6 py-4 text-left text-xs font-bold text-slate-500 uppercase tracking-wider">Brand</th>
                                            <th className="px-6 py-4 text-right text-xs font-bold text-slate-500 uppercase tracking-wider">Total FTDs</th>
                                            <th className="px-6 py-4 text-right text-xs font-bold text-slate-500 uppercase tracking-wider">Retained M1</th>
                                            <th className="px-6 py-4 text-right text-xs font-bold text-slate-500 uppercase tracking-wider">Retention %</th>
                                            <th className="px-6 py-4 text-right text-xs font-bold text-slate-500 uppercase tracking-wider">Amount (THB)</th>
                                        </tr>
                                    </thead>
                                    <tbody className="bg-white divide-y divide-slate-100">
                                        {processedDisplayData.map((row, idx) => (
                                            <tr key={idx} className="hover:bg-indigo-50/30 transition-colors">
                                                <td className="px-6 py-4 whitespace-nowrap text-sm font-medium text-slate-700">{row.month}</td>
                                                <td className="px-6 py-4 whitespace-nowrap text-sm">
                                                    <span className="bg-slate-100 text-slate-600 px-2.5 py-1 rounded-md font-semibold text-xs border border-slate-200">{row.brand}</span>
                                                </td>
                                                <td className="px-6 py-4 whitespace-nowrap text-sm text-slate-600 text-right font-medium">{row.totalFTDs.toLocaleString()}</td>
                                                <td className="px-6 py-4 whitespace-nowrap text-sm text-slate-600 text-right">{row.retainedM1.toLocaleString()}</td>
                                                <td className="px-6 py-4 whitespace-nowrap text-sm text-right">
                                                    <span className={`font-bold ${row.retentionRate > 0.3 ? 'text-emerald-600' : 'text-slate-800'}`}>
                                                        { (row.retentionRate > 1 ? row.retentionRate : row.retentionRate * 100).toFixed(2) }%
                                                    </span>
                                                </td>
                                                <td className="px-6 py-4 whitespace-nowrap text-sm text-slate-600 text-right font-mono">
                                                    {row.amount.toLocaleString('en-US', { style: 'currency', currency: 'THB', minimumFractionDigits: 0 })}
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                    </main>
                    
                    <footer className="max-w-[1400px] mx-auto px-6 py-8 text-center text-slate-400 text-xs no-print">
                        <p>Generated by FTD Retention Analytics • Internal Use Only</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>
</body>
</html>
